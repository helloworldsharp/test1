rules:
  - RULE-SET,lan,🎯 全球直连
  - RULE-SET,ad_allow,🎯 全球直连
  - RULE-SET,apple_push,🍎 苹果推送
  - RULE-SET,ad_anti_ad,🛡 广告拦截
  - RULE-SET,direct_custom,🎯 全球直连
  - RULE-SET,steam_cn,🎯 全球直连
  # 高优先级代理例外：指定设备仍使用各自策略组，其他设备使用主代理组。
  - AND,((RULE-SET,proxy_override),(RULE-SET,src_alone1)),📱 指定设备1
  - AND,((RULE-SET,proxy_override),(RULE-SET,src_alone2)),🖱️ 指定设备2
  - RULE-SET,proxy_override,🚀 节点选择
  # 直接复用当前服务域名集，避免重复排除集独立刷新；排除检查先于 IPv4 解析。
  - AND,((NOT,((RULE-SET,google))),(NOT,((RULE-SET,wbrokers))),(RULE-SET,china_domain)),🎯 全球直连
  - AND,((NOT,((RULE-SET,google))),(NOT,((RULE-SET,wbrokers))),(RULE-SET,china_company_ip)),🎯 全球直连
  - RULE-SET,src_alone1,📱 指定设备1
  - RULE-SET,src_alone2,🖱️ 指定设备2
  - RULE-SET,proxy_custom,🚀 节点选择
  - RULE-SET,binance,🪙 BNQ
  - AND,((RULE-SET,crypto),(NOT,((RULE-SET,bybit)))),🪙 BNQ
  - RULE-SET,bybit,💶 Bybit
  - RULE-SET,wbrokers,📈 海外券商
  - RULE-SET,ai_openai,🤖 AI
  - RULE-SET,ai_anthropic,🤖 AI
  - RULE-SET,github,🚀 节点选择
  - RULE-SET,twitter,🐦 XGORK
  - RULE-SET,steam,😄 Steam
  - RULE-SET,xbox,🎮 其他游戏平台
  - RULE-SET,epic,🎮 其他游戏平台
  - RULE-SET,origin,🎮 其他游戏平台
  - RULE-SET,sony,🎮 其他游戏平台
  - RULE-SET,nintendo,🎮 其他游戏平台
  - RULE-SET,google_fcm,🍀 Google相关
  - RULE-SET,google,🍀 Google相关
  - RULE-SET,google_non_domain,🍀 Google相关
  - RULE-SET,youtube,🍀 Google相关
  - RULE-SET,microsoft,Ⓜ 微软服务
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,telegram,🚀 节点选择
  - RULE-SET,netflix,🎥 奈飞视频
  - RULE-SET,proxy_gfwlist,🚀 节点选择
  - RULE-SET,proxy_foreign,🚀 节点选择
  - MATCH,🐟 漏网之鱼
