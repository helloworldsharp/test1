name: Rule validation and update
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r scripts/rule-updater/requirements.txt
      - run: python -m unittest discover -s scripts/rule-updater -p 'test*.py'
      - name: Prepare candidate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" ]]; then
            python scripts/rule-updater/updater.py --output "$RUNNER_TEMP/candidate"
          else
            cp -r rules/generated "$RUNNER_TEMP/candidate"
          fi
      - run: python scripts/rule-updater/get_mihomo.py --output "$RUNNER_TEMP/mihomo"
      - run: python scripts/rule-updater/verify_kernel.py --candidate "$RUNNER_TEMP/candidate" --mihomo "$RUNNER_TEMP/mihomo" --evidence "$RUNNER_TEMP/kernel"
      - name: Verify priority regressions are detected
        run: |
          for mutation in bnq-shadow devices-first; do
            if python scripts/rule-updater/verify_kernel.py --candidate "$RUNNER_TEMP/candidate" --mihomo "$RUNNER_TEMP/mihomo" --evidence "$RUNNER_TEMP/$mutation" --mutate "$mutation"; then
              echo "Regression was not detected"; exit 1
            fi
            test -s "$RUNNER_TEMP/$mutation/report.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-evidence
          path: |
            ${{ runner.temp }}/kernel
            ${{ runner.temp }}/bnq-shadow
            ${{ runner.temp }}/devices-first
      - name: Failure summary
        if: failure()
        run: echo 'Rule update/validation failed. Production data was not published. Inspect the failed step and kernel evidence; GitHub Actions failure email must be enabled by the receiving account.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: validate
    if: vars.RULE_AUTO_PUBLISH == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-candidate
          path: ${{ runner.temp }}/candidate
      - name: Require completed production URL migration
        run: |
          if grep -q 'codex/routing-refactor' fragments/rule-providers.yaml; then
            echo 'Production URLs have not been migrated'; exit 1
          fi
      - run: python scripts/rule-updater/publish.py --candidate "$RUNNER_TEMP/candidate"
      - name: Publish one data commit
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update validated routing data'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
